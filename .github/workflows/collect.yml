name: collect

on:
  schedule:
    - cron: "43 20 * * *"   # 05:43 KST daily
  workflow_dispatch:
    inputs:
      since:
        description: "Replay window start (YYYY-MM-DD). Empty = daily mode"
        required: false
      until:
        description: "Replay window end (YYYY-MM-DD)"
        required: false
      case:
        description: "Erdős problem number to highlight in the report (optional)"
        required: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Collect (daily)
        if: ${{ !inputs.since }}
        env:
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
        run: python -m tracker.collect --daily

      - name: Collect + score (replay)
        if: ${{ inputs.since }}
        env:
          OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
        run: |
          python -m tracker.collect --since "${{ inputs.since }}" --until "${{ inputs.until }}"
          python -m validation.replay --since "${{ inputs.since }}" --until "${{ inputs.until }}" \
            ${{ inputs.case && format('--case {0}', inputs.case) || '' }}

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet && exit 0
          git commit -m "collect: ${{ inputs.since && format('replay {0}..{1}', inputs.since, inputs.until) || 'daily' }}"
          git pull --rebase
          git push
